services:
  postgres:
    image: postgres:16-alpine
    container_name: halo-postgres
    environment:
      POSTGRES_USER: halo
      POSTGRES_PASSWORD: halo_password
      POSTGRES_DB: halo_dev
    ports:
      - "5432:5432"
    volumes:
      - halo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halo -d halo_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: halo-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  halo_postgres_data:
